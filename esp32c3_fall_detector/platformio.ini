[platformio]
src_dir = .
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; upload_port / monitor_port не указаны намеренно: PlatformIO сам находит
; последовательный порт. При необходимости задайте их локально, не коммитьте
; путь, зависящий от ОС (например, COM4 или /dev/ttyACM0).
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
